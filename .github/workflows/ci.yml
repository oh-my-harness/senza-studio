name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows packaging and packaged E2E
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out studio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio_frontend/package-lock.json

      - name: Resolve Agent Team runtime pin
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          commit="$(node -p "require('./packaging/agent-team-runtime.json').commit")"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Agent Team pin::Expected a 40-character commit SHA"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Agent Team runtime
        uses: actions/checkout@v4
        with:
          repository: oh-my-harness/llm-harness-runtime
          ref: ${{ steps.runtime.outputs.commit }}
          path: llm-harness-runtime
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate Cargo Git dependencies
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Build Agent Team runtime
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --release --workspace --all-features
        working-directory: llm-harness-runtime

      - name: Configure Windows code signing
        shell: powershell
        env:
          RELEASE_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          RELEASE_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          RELEASE_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          $isRelease = $env:GITHUB_REF -like "refs/tags/*"
          if ($isRelease) {
              if ([string]::IsNullOrWhiteSpace($env:RELEASE_CSC_LINK) -or
                  [string]::IsNullOrWhiteSpace($env:RELEASE_CSC_KEY_PASSWORD) -or
                  [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_THUMBPRINT)) {
                  throw "Tag builds require WINDOWS_CSC_LINK, WINDOWS_CSC_KEY_PASSWORD, and WINDOWS_CERTIFICATE_THUMBPRINT secrets."
              }
              Add-Content $env:GITHUB_ENV "WIN_CSC_LINK=$env:RELEASE_CSC_LINK"
              Add-Content $env:GITHUB_ENV "WIN_CSC_KEY_PASSWORD=$env:RELEASE_CSC_KEY_PASSWORD"
              Add-Content $env:GITHUB_ENV "SENZA_STUDIO_WINDOWS_CERTIFICATE_THUMBPRINT=$env:RELEASE_CERTIFICATE_THUMBPRINT"
          } else {
              $passwordText = [Guid]::NewGuid().ToString("N")
              $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
              $certificate = New-SelfSignedCertificate `
                  -Type CodeSigningCert `
                  -Subject "CN=Senza Studio CI" `
                  -CertStoreLocation "Cert:\CurrentUser\My"
              $certificatePath = Join-Path $env:RUNNER_TEMP "senza-studio-ci.cer"
              $pfxPath = Join-Path $env:RUNNER_TEMP "senza-studio-ci.pfx"
              Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null
              Import-Certificate -FilePath $certificatePath -CertStoreLocation "Cert:\LocalMachine\Root" | Out-Null
              Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $password | Out-Null
              Add-Content $env:GITHUB_ENV "WIN_CSC_LINK=$pfxPath"
              Add-Content $env:GITHUB_ENV "WIN_CSC_KEY_PASSWORD=$passwordText"
              Add-Content $env:GITHUB_ENV "SENZA_STUDIO_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)"
          }

      - name: Build Windows NSIS installer
        shell: bash
        env:
          SENZA_STUDIO_AGENT_TEAM_BIN: ${{ github.workspace }}/llm-harness-runtime/target/release/agent-studio.exe
        run: bash scripts/package-desktop.sh win

      - name: Verify artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find dist/desktop -maxdepth 1 -type f -name 'senza-studio-*-win-x64.exe' -print -quit)"
          if [[ -z "$artifact" ]]; then
            echo "::error title=Missing Windows artifact::NSIS installer was not created"
            exit 1
          fi
          (cd dist/desktop && sha256sum -c "$(basename "$artifact").sha256")

      - name: Run packaged Windows E2E
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          artifact="$(find dist/desktop -maxdepth 1 -type f -name 'senza-studio-*-win-x64.exe' -print -quit)"
          build/desktop-resources/python/python.exe scripts/test_packaged_desktop.py "$artifact" --timeout 180

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: senza-studio-windows-x64
          path: |
            dist/desktop/senza-studio-*-win-x64.exe
            dist/desktop/senza-studio-*-win-x64.exe.sha256
          if-no-files-found: error

  python:
    name: Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out studio
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Senza SDK
        shell: bash
        run: |
          set -euo pipefail
          locked_version="$(jq -r '.senza_version' senza-sdk.lock)"
          if [[ -z "$locked_version" || "$locked_version" == "null" ]]; then
            echo "::error title=Invalid Senza pin::senza-sdk.lock does not contain senza_version"
            exit 1
          fi
          python -m pip install --only-binary=:all: "senza-sdk==$locked_version"

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          locked_version="$(jq -r '.senza_version' senza-sdk.lock)"
          installed_version="$(python -c 'import importlib.metadata; print(importlib.metadata.version("senza-sdk"))')"
          if [[ "$locked_version" != "$installed_version" ]]; then
            echo "::error title=Senza SDK pin mismatch::locked=$locked_version installed=$installed_version"
            exit 1
          fi
          # 两个子目录包都要装：studio_backend 直接 import senza_studio_runtime
          # （Phase 7 把 executor/judge/预处理器搬了过去），而且 pyproject 的
          # testpaths 也会去收这两个包自己的测试。
          python -m pip install -e "./senza-studio-components[dev]"
          python -m pip install -e "./senza-studio-runtime[dev]"
          python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Check Senza API compatibility
        run: python scripts/check_senza_compat.py

      - name: Check installed Python dependencies
        run: python -m pip check

      - name: Validate desktop Python lock
        run: |
          PYTHONNOUSERSITE=1 python -m pip install --dry-run \
            --only-binary=:all: \
            --require-hashes \
            -r packaging/desktop-python.lock

      - name: Check packaging scripts
        run: |
          bash -n scripts/package-desktop.sh
          python -m py_compile scripts/test_packaged_desktop.py

      - name: Check shell scripts
        run: bash -n dev.sh

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out studio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: studio_frontend
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Build frontend
        working-directory: studio_frontend
        run: npm run build

      - name: Run Electron runtime host tests
        working-directory: studio_frontend
        run: npm test -- --run

      - name: Audit production frontend dependencies
        working-directory: studio_frontend
        run: npm audit --omit=dev

      - name: Check Electron entry syntax
        run: |
          node --check studio_frontend/electron/main.cjs
          node --check studio_frontend/electron/backend-port.cjs
          node --check studio_frontend/electron/desktop-diagnostics.cjs
          node --check studio_frontend/electron/desktop-process-host.cjs
          node --check studio_frontend/electron/runtime-host.cjs
          node --check studio_frontend/electron/verify-pack.cjs

      - name: Check repository diff hygiene
        run: git diff --check
