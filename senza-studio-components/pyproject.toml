[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senza-studio-components"
version = "0.1.0"
description = "Shared prefab tools and capability components for Senza Studio."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["senza_studio_components*"]
